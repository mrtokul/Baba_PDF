name: APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Debug APK derle
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee build.log || { grep -E "^e: |What went wrong|Could not|Duplicate|error:" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: BabaPDF-apk
          path: app/build/outputs/apk/debug/*.apk
