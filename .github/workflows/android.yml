name: APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Debug APK derle
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee build.log || { grep -E "^e: |What went wrong|Could not|Duplicate|error:" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: BabaPDF-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Son APK'yi surum olarak yayinla
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Baba_PDF.apk
          gh release delete son -y --cleanup-tag || true
          gh release create son Baba_PDF.apk --title "Son derleme" --notes "Otomatik: main dalinin son debug APK'si" --target "$GITHUB_SHA"
